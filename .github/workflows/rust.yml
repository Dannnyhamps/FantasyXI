name: Rust CI

on:
  push:
    branches:
      - main
    paths:
      - "contracts/**"
      - ".github/workflows/rust.yml"
  pull_request:
    branches:
      - main
    paths:
      - "contracts/**"
      - ".github/workflows/rust.yml"

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-ci:
    name: Build & Test Soroban Escrow Contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get install -y binaryen

      - name: Verify code formatting (cargo fmt)
        run: cargo fmt --check
      - name: Run cargo build
        run: |
          cargo build --verbose
          RUSTFLAGS="-C target-feature=-reference-types" cargo build --target wasm32-unknown-unknown --release --verbose

      - name: Post-process wasm
        run: |
          WASM=target/wasm32-unknown-unknown/release/fantasyxi_escrow.wasm
          wasm-opt -O --strip-producers \
            --enable-bulk-memory \
            --enable-sign-ext \
            --disable-reference-types \
            "$WASM" -o "$WASM"

      - name: Run clippy linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run contract unit tests
        run: cargo test --verbose

      - name: Build contract for wasm32 release target
        run: cargo build --target wasm32-unknown-unknown --release --verbose
